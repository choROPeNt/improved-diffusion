[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "improved-diffusion"
version = "0.1.0"
description = "Improved diffusion package"
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
    "blobfile>=1.0.5",
    "torch",
    "tqdm",
    "numpy",
    "mpi4py",
    "torchinfo",
]

[tool.setuptools]
py-modules = ["improved_diffusion"]